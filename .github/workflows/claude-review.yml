name: Claude Code PR Review

on:
  workflow_run:
    workflows: ["Test Plugin"]
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # CI 全パス後の自動レビュー（同一リポジトリのPRのみ）
  setup:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get PR number
        id: pr
        run: |
          PR_NUMBER=$(gh pr list --head "${{ github.event.workflow_run.head_branch }}" --json number --jq '.[0].number')
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

  auto-review:
    needs: setup
    if: needs.setup.outputs.pr_number != ''
    uses: tarosky/workflows/.github/workflows/claude-review.yml@main
    with:
      plugin_name: wp-hamazon
      ci_checks: "PHPUnit (PHP 8.1/8.3 x WP latest/6.1), PHPCS, PHPStan Level 5, PHP lint, ESLint, Stylelint, asset build"
      pr_number: ${{ fromJSON(needs.setup.outputs.pr_number) }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      custom_focus: |
        - Amazon Creators API / DMM / PHG など外部APIのレスポンスを出力する箇所のエスケープ（esc_html / esc_url / wp_kses）と、レスポンス欠損・null時の防御
        - REST エンドポイント（hamazon/v3/{service}）の permission_callback と入力サニタイズ、APIキー等の認証情報がフロントやログに漏れないこと
        - app/Amazon/ は同梱した Amazon 公式SDKのため手編集を避け、PHP 8.1 下限と WordPress 6.1 下限の互換性を保つこと
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # "@claude auto-review" で手動レビュー（メンバーのみ、PRコメントのみ）
  manual-setup:
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@claude auto-review') &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ github.event.issue.number }}
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT

  manual-review:
    needs: manual-setup
    if: needs.manual-setup.outputs.pr_number != ''
    uses: tarosky/workflows/.github/workflows/claude-review.yml@main
    with:
      plugin_name: wp-hamazon
      ci_checks: "PHPUnit (PHP 8.1/8.3 x WP latest/6.1), PHPCS, PHPStan Level 5, PHP lint, ESLint, Stylelint, asset build"
      pr_number: ${{ fromJSON(needs.manual-setup.outputs.pr_number) }}
      head_sha: ${{ needs.manual-setup.outputs.head_sha }}
      is_manual: true
      custom_focus: |
        - Amazon Creators API / DMM / PHG など外部APIのレスポンスを出力する箇所のエスケープ（esc_html / esc_url / wp_kses）と、レスポンス欠損・null時の防御
        - REST エンドポイント（hamazon/v3/{service}）の permission_callback と入力サニタイズ、APIキー等の認証情報がフロントやログに漏れないこと
        - app/Amazon/ は同梱した Amazon 公式SDKのため手編集を避け、PHP 8.1 下限と WordPress 6.1 下限の互換性を保つこと
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
